name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read   # nothing here writes to the repository

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor the package promises (requires-python); 3.14 is what the author's machine runs.
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -W error::ResourceWarning -m unittest discover -s tests -v

  macos:
    # A Mac is not scanned yet: the host modes must stop with exit 3 and say so, and the modes that read no host must still run.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15]   # macos-14 is not offered to this account ("configuration macos-14-arm64-us-default is not supported")
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -W error::ResourceWarning -m unittest tests.test_macos_stop tests.test_project -v
      - name: the Mac is read, and the parts that cannot read it yet stop
        run: |
          export PYTHONPATH=src
          python -m lattice_scan.cli --version
          # reading this Mac: no network, nothing sent; must name macOS and list apps
          python -m lattice_scan.cli --refresh --inventory 2> read.err | tee read.out
          grep -q "macOS" read.out && grep -q "apps read" read.err
          # posture is not built for a Mac yet: it must stop with exit 3
          rc=0; python -m lattice_scan.cli posture 2> stop.txt || rc=$?
          cat stop.txt
          test "$rc" = 3 && grep -q "runs macOS" stop.txt

  build:
    # The three artifacts must keep building, and the bundled skill script must equal the source (tests/test_skill.py fails if not).
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y fakeroot
      - run: python -m pip install "setuptools>=84.1.0" wheel
      - run: python packaging/build.py
      - run: dpkg-deb --info dist/*.deb && python dist/lattice-scan.pyz --version
