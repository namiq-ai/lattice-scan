name: release
# Runs when a version tag is pushed. It builds, checks the tag against the package version, and makes a DRAFT GitHub release with checksums. A person
# publishes the draft. The PyPI job below only runs after the "pypi" environment (set up by the owner, with required reviewers) approves it, and it
# uses trusted publishing: there is no PyPI token anywhere in this repository.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y fakeroot
      - run: python -m pip install "setuptools>=77" wheel
      - name: Tag must equal the package version
        run: |
          v=$(python -c "import sys; sys.path.insert(0,'src'); from lattice_scan import __version__ as v; print(v)")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package version v$v"; exit 1; }
      - run: python -W error::ResourceWarning -m unittest discover -s tests
      - run: python packaging/build.py
      - run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job may create the (draft) release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --draft --title "${GITHUB_REF_NAME}" \
            --notes "Draft. Checksums are in SHA256SUMS; publish after checking them."

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi          # the owner creates this environment with required reviewers; until then this job waits or fails, and nothing is uploaded
    permissions:
      id-token: write          # trusted publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist
      - run: mkdir upload && cp dist/*.whl upload/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: upload
